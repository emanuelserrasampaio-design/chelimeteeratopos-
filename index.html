<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕹️ Retro Glitch & Speedrun 🕹️</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #1a1a1a; color: #ffffff; font-family: 'Arial', sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .container-principal { max-width: 1100px; margin: 0 auto; background-color: #2d2d2d; padding: 30px; border: 5px solid #00ffcc; border-radius: 15px; box-shadow: 0 0 15px #00ffcc; }
        h1, h2, h3 { font-family: 'Press Start 2P', monospace; text-align: center; }
        h1 { color: #ff00ff; font-size: 24px; text-shadow: 3px 3px #000; margin-bottom: 25px; }
        h2 { color: #00ffcc; font-size: 16px; border-bottom: 3px dashed #ff00ff; padding-bottom: 15px; margin-top: 10px; }
        h3 { color: #ffff00; font-size: 12px; text-align: left; }
        .instrucoes-topo { background-color: #004400; border: 2px solid #00ff00; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 25px; }
        .conteudo-flex { display: flex; gap: 20px; margin-top: 20px; }
        .painel-lista { flex: 1; max-height: 550px; overflow-y: auto; background-color: #111111; padding: 15px; border: 3px solid #ff00ff; border-radius: 10px; }
        .painel-lista h3 { text-align: center; color: #ff00ff; margin-top: 0; }
        .item-jogo { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background-color: #222222; color: #00ff00; border: 2px solid #333333; border-radius: 5px; font-family: 'Press Start 2P', monospace; font-size: 10px; text-align: left; cursor: pointer; transition: 0.2s; }
        .item-jogo:hover { background-color: #ff00ff; color: #ffffff; border-color: #ffffff; }
        .item-jogo.ativo { background-color: #00ffcc; color: #000000; border-color: #00ffcc; font-weight: bold; }
        .painel-detalhes { flex: 2; background-color: #222222; padding: 20px; border: 3px solid #00ffcc; border-radius: 10px; min-height: 400px; }
        .dica { background-color: #4a004a; border-left: 5px solid #ff00ff; padding: 15px; border-radius: 5px; font-weight: bold; }
        .imagem-explicativa { width: 100%; height: 180px; background-color: #000000; border: 3px solid #ffff00; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 20px 0; color: #ffff00; font-size: 12px; text-align: center; padding: 15px; box-sizing: border-box; }
        .tag-console { display: inline-block; background-color: #ff00ff; color: white; padding: 4px 8px; border-radius: 3px; font-size: 10px; margin-bottom: 10px; font-family: 'Press Start 2P', monospace; }
        @media (max-width: 768px) { .conteudo-flex { flex-direction: column; } .painel-lista { max-height: 250px; } }
    </style>
</head>
<body>

    <div class="container-principal">
        <h1>🕹️ GUIA MASTER: ZERANDO NO MODO TURBO 🕹️</h1>

        <div class="instrucoes-topo">
            <p>Clique em qualquer jogo da lista para ver as instruções.</p>
        </div>

        <div class="conteudo-flex">
            <div class="painel-lista">
                <h3>🎮 JOGOS</h3>
                <div id="lista-botoes">Carregando catálogo...</div>
            </div>

            <div class="painel-detalhes" id="detalhes-jogo">
                <p>Selecione um jogo na lista ao lado.</p>
            </div>
        </div>
    </div>

    <script>
        // API Gratuita carregando lista de jogos dinamicamente
        const API_KEY = 'c53a7015984d4bb285251c802b7da23f'; // Chave pública de testes
        let bancoDeJogos = [];

        const listaBotoes = document.getElementById('lista-botoes');
        const painelDetalhes = document.getElementById('detalhes-jogo');

        async function carregarMilJogos() {
            try {
                // Busca os jogos da API (80 jogos por página)
                const resposta = await fetch(`https://api.rawg.io/api/games?key=${API_KEY}&page_size=80`);
                const dados = await resposta.json();
                
                bancoDeJogos = dados.results.map(jogo => ({
                    titulo: jogo.name,
                    console: jogo.platforms ? jogo.platforms[0].platform.name : 'Retro',
                    intro: `Jogo lançado em ${jogo.released || 'N/A'} com avaliação ${jogo.rating}/5.`,
                    passoAPasso: "Acesse o menu principal do jogo, selecione o modo campanha e utilize os atalhos de controle.",
                    textoImagem1: `[IMAGEM 1: Tela principal de ${jogo.name}]`,
                    dica: `Aproveite as mecânicas do console para obter conquistas e pontuações mais altas!`,
                    textoImagem2: `[IMAGEM 2: Gameplay em ação]`
                }));

                criarListaDeBotoes();
                if(bancoDeJogos.length > 0) carregarInstrucoes(0);
            } catch (erro) {
                listaBotoes.innerHTML = 'Erro ao carregar catálogo de jogos.';
            }
        }

        function carregarInstrucoes(indexJogo) {
            const jogo = bancoDeJogos[indexJogo];
            
            painelDetalhes.innerHTML = `
                <h2>${jogo.titulo}</h2>
                <span class="tag-console">${jogo.console}</span>
                <p>${jogo.intro}</p>
                <h3>Passo a Passo</h3>
                <p>${jogo.passoAPasso}</p>
                <div class="imagem-explicativa">${jogo.textoImagem1}</div>
                <p class="dica">🔥 DICA DE OURO: ${jogo.dica}</p>
                <div class="imagem-explicativa">${jogo.textoImagem2}</div>
            `;

            const botoes = document.querySelectorAll('.item-jogo');
            botoes.forEach((btn, idx) => {
                if(idx === indexJogo) btn.classList.add('ativo');
                else btn.classList.remove('ativo');
            });
        }

        function criarListaDeBotoes() {
            listaBotoes.innerHTML = '';
            bancoDeJogos.forEach((jogo, index) => {
                const btn = document.createElement('button');
                btn.className = 'item-jogo';
                btn.textContent = `▶ ${jogo.titulo}`;
                btn.onclick = () => carregarInstrucoes(index);
                listaBotoes.appendChild(btn);
            });
        }

        carregarMilJogos();
    </script>
</body>
</html>
