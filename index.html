<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕹️ Retro Glitch & Speedrun 🕹️</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILOS (CSS) */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            background-color: #2d2d2d;
            padding: 30px;
            border: 5px solid #00ffcc;
            border-radius: 15px;
            box-shadow: 0 0 15px #00ffcc;
        }

        h1, h2, h3 {
            font-family: 'Press Start 2P', monospace;
            text-align: center;
        }

        h1 { color: #ff00ff; font-size: 28px; text-shadow: 3px 3px #000; margin-bottom: 30px; }
        h2 { color: #00ffcc; font-size: 20px; border-bottom: 3px dashed #ff00ff; padding-bottom: 15px; margin-top: 40px; }
        h3 { color: #ffff00; font-size: 16px; text-align: left; }

        .dica {
            background-color: #4a004a;
            border-left: 5px solid #ff00ff;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .imagem-explicativa {
            width: 100%;
            height: 250px;
            background-color: #000000;
            border: 3px solid #ffff00;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #ffff00;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .boas-vindas {
            background-color: #004400;
            border: 2px solid #00ff00;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
        }

        .area-busca {
            text-align: center;
            margin-bottom: 40px;
        }

        #busca {
            width: 85%;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            background-color: #000000;
            color: #00ff00;
            border: 3px solid #ff00ff;
            border-radius: 5px;
            outline: none;
            box-shadow: 0 0 10px #ff00ff;
            text-transform: uppercase;
        }

        #busca::placeholder {
            color: #005500;
        }
        
        /* Tag de categoria do jogo */
        .tag-console {
            display: inline-block;
            background-color: #ff00ff;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            margin-bottom: 10px;
            font-family: 'Press Start 2P', monospace;
        }
    </style>
</head>
<body>

    <main>
        <h1>🕹️ GUIA MASTER: ZERANDO NO MODO TURBO 🕹️</h1>

        <div class="boas-vindas">
            <p><strong>BEM-VINDES AO NOSSO FLIPERAMA VIRTUAL!</strong></p>
            <p>Não importa se você é um jogador veterano, se joga apenas no final de semana ou se usa controles adaptados: este espaço é para <strong>todos</strong>. Nosso objetivo é catalogar 1000 jogos lendários!</p>
        </div>

        <div class="area-busca">
            <input type="text" id="busca" placeholder="🔍 DIGITE O NOME DO JOGO...">
        </div>

        <div id="lista-de-jogos"></div>
    </main>

        const campoBusca = document.getElementById('busca');

        function mostrarJogos(jogosParaMostrar) {
            containerJogos.innerHTML = '';
            
            if(jogosParaMostrar.length === 0) {
                containerJogos.innerHTML = '<h3 style="text-align:center; margin-top: 40px;">❌ Game Over! Nenhum jogo encontrado.</h3>';
                return;
            }

            jogosParaMostrar.forEach(jogo => {
                const secao = document.createElement('section');
                secao.innerHTML = `
                    <h2>${jogo.titulo}</h2>
                    <span class="tag-console">${jogo.console}</span>
                    <p>${jogo.intro}</p>
                    <h3>Passo a Passo</h3>
                    <p>${jogo.passoAPasso}</p>
                    <div class="imagem-explicativa">${jogo.textoImagem1}</div>
                    <p class="dica">🔥 DICA DE OURO: ${jogo.dica}</p>
